<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d">
<title id="t">pcSecPichia</title>
<desc id="d">A sparse constraint matrix with a stoichiometric diagonal band and horizontal coupling blocks feeds a ranked list of candidates. Below the ranked bars sits one full-width bar left deliberately empty and dashed, standing for the absolute quantity the model declines to report.</desc>
<defs>
  <pattern id="pd" width="7" height="7" patternUnits="userSpaceOnUse">
    <circle cx="3.5" cy="3.5" r="1.45" class="dA"/>
  </pattern>
  <pattern id="ps" width="11" height="11" patternUnits="userSpaceOnUse">
    <circle cx="5.5" cy="5.5" r="1.25" class="dB"/>
  </pattern>
  <pattern id="pv" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="7" r="1.1" class="dC"/>
  </pattern>
  <clipPath id="mx"><rect x="70" y="35" width="290" height="180" rx="4"/></clipPath>
</defs>
<style>
  .bg{fill:#ffffff}
  .fr{fill:none;stroke:#d8d5cc;stroke-width:1.5}
  .dA{fill:#0F766E}
  .dB{fill:#8b8b85}
  .dC{fill:#b4b2a9}
  .bar{fill:#0F766E}
  .bar2{fill:#5DCAA5}
  .void{fill:none;stroke:#b4b2a9;stroke-width:1.5;stroke-dasharray:6 5}
  .sep{stroke:#e0ded7;stroke-width:1}
  .fl{fill:#c4c2ba}
  @media (prefers-color-scheme:dark){
    .bg{fill:#0d1117}
    .fr{stroke:#3a3d44}
    .dA{fill:#2fa88f}
    .dB{fill:#6e6e68}
    .dC{fill:#4a4a46}
    .bar{fill:#2fa88f}
    .bar2{fill:#1d7a68}
    .void{stroke:#5f5e5a}
    .sep{stroke:#26262b}
    .fl{fill:#4a4a46}
  }
</style>
<rect class="bg" x="0" y="0" width="1000" height="250"/>

<g clip-path="url(#mx)">
  <rect x="70" y="35" width="290" height="180" fill="url(#pv)"/>
  <rect x="70" y="62" width="290" height="15" fill="url(#ps)"/>
  <rect x="70" y="97" width="290" height="11" fill="url(#ps)"/>
  <rect x="70" y="129" width="290" height="9" fill="url(#ps)"/>
  <rect x="70" y="159" width="290" height="12" fill="url(#ps)"/>
  <rect x="70" y="188" width="290" height="8" fill="url(#ps)"/>
  <path d="M 70,35 L 124,35 L 360,215 L 306,215 Z" fill="url(#pd)"/>
</g>
<rect class="fr" x="70" y="35" width="290" height="180" rx="4"/>

<path class="fl" d="M 392 118 L 392 132 L 424 132 L 424 140 L 442 125 L 424 110 L 424 118 Z"/>

<rect class="bar" x="470" y="45" width="420" height="16" rx="3"/>
<rect class="bar" x="470" y="73" width="348" height="16" rx="3"/>
<rect class="bar" x="470" y="101" width="286" height="16" rx="3"/>
<rect class="bar2" x="470" y="129" width="205" height="16" rx="3"/>
<rect class="bar2" x="470" y="157" width="148" height="16" rx="3"/>

<line class="sep" x1="470" y1="186" x2="890" y2="186"/>

<rect class="void" x="470" y="197" width="420" height="22" rx="3"/>
</svg>
